<header class="header--main">

	<div class="wrap grid__2-col">
		<a href="{{ site.baseurl }}/" class="header__logo">
			<img src="{{ site.data.settings.header_settings.logo_image | relative_url }}" class="header__logo__img" alt="{{ site.data.settings.basic_settings.site_title }}">
		</a>

		<button type="button" class="menu__toggle js-menu-toggle" aria-label="Menu">
			<div class="menu__toggle__icon"><span></span></div>
		</button>

		<nav class="header__menu">
			<div class="menu__wrap">
				<ul class="menu__list">
					{% for item in site.data.settings.menu_settings.menu_items %}
					<li class="menu__list__item">
						<a href="{{ item.url | relative_url }}" class="menu__list__item__link button--text">{{ item.title }}</a>
					</li>
					{% endfor %}
					<li class="menu__list__item">
						<a href="https://github.com/UCSB-AMPLab" class="menu__list__item__link button--text">GitHub</a>
					</li>
				</ul>
			</div>
		</nav>

	</div>

</header>
